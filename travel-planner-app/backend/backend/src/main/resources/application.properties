# ==================== APPLICATION ====================
spring.application.name=travel-planner-backend
server.port=8080

# ==================== DATABASE ====================
spring.datasource.url=jdbc:mysql://localhost:3306/travel_planner?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mahesh
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== JPA ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==================== JWT ====================
jwt.secret=yourSecretKeyHereWithAtLeast32CharactersLengthForHS256Sham
jwt.expiration=86400000
jwt.refresh.expiration=604800000


# ==================== JACKSON ====================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# ==================== FILE UPLOAD ====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==================== OFFLINE DATA ====================
offline.storage.max-per-user=52428800
offline.data.expiry-days=30
offline.cleanup.cron=0 0 3 * * ?

# ==================== CACHE ====================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=3600s

# ==================== CORS ====================
cors.allowed-origins=http://localhost:5173
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

